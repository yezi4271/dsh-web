<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 14" fill="none" aria-hidden="true">
  <!--
    Blue-throated Bee-eater skin - selected-element branch ornament.
    A slender flowering twig drawn for the bottom edge of the selected
    sidebar row and selected tabs: azure-tinted bark, teal-green leaves,
    white five-petal blossoms with chestnut centers (the bee-eater's crown
    colour). Original artwork by dsh-web, Apache-2.0.
  -->
  <!-- main twig -->
  <path d="M2 10.6 C 34 9.2, 70 10.6, 108 8.9 S 192 10.2, 218 10.8"
        stroke="#4a7d90" stroke-width="1.5" stroke-linecap="round"/>
  <!-- offshoot twiglet ending in a bud -->
  <path d="M64 9.7 C 68 7.8, 71 6.4, 76 5.2"
        stroke="#4a7d90" stroke-width="1.1" stroke-linecap="round"/>
  <ellipse cx="78" cy="4.6" rx="2.2" ry="3.4" fill="#79b7a1"/>
  <ellipse cx="79.4" cy="3.8" rx="1" ry="1.6" fill="#dff0ec"/>
  <!-- leaves -->
  <g>
    <path d="M0 0 C 2.4 -1.8, 7.2 -1.8, 9.8 0 C 7.2 1.4, 2.4 1.4, 0 0 Z" fill="#57ae8c" transform="translate(14 9.9) rotate(-14)"/>
    <path d="M0 0 C 2.4 -1.8, 7.2 -1.8, 9.8 0 C 7.2 1.4, 2.4 1.4, 0 0 Z" fill="#6fbfa0" transform="translate(24 10.4) rotate(12)"/>
    <path d="M0 0 C 2.4 -1.8, 7.2 -1.8, 9.8 0 C 7.2 1.4, 2.4 1.4, 0 0 Z" fill="#57ae8c" transform="translate(92 9.9) rotate(-12)"/>
    <path d="M0 0 C 2.4 -1.8, 7.2 -1.8, 9.8 0 C 7.2 1.4, 2.4 1.4, 0 0 Z" fill="#6fbfa0" transform="translate(148 10.3) rotate(13)"/>
    <path d="M0 0 C 2.4 -1.8, 7.2 -1.8, 9.8 0 C 7.2 1.4, 2.4 1.4, 0 0 Z" fill="#57ae8c" transform="translate(160 9.8) rotate(-15)"/>
    <path d="M0 0 C 2.4 -1.8, 7.2 -1.8, 9.8 0 C 7.2 1.4, 2.4 1.4, 0 0 Z" fill="#6fbfa0" transform="translate(200 10.7) rotate(10)"/>
  </g>
  <!-- blossom left -->
  <g transform="translate(44 8.2)">
    <ellipse rx="2.1" ry="3.2" fill="#f7fbfd" stroke="#7fc3e8" stroke-width="0.7" transform="rotate(0) translate(0 -3.3)"/>
    <ellipse rx="2.1" ry="3.2" fill="#f7fbfd" stroke="#7fc3e8" stroke-width="0.7" transform="rotate(72) translate(0 -3.3)"/>
    <ellipse rx="2.1" ry="3.2" fill="#f7fbfd" stroke="#7fc3e8" stroke-width="0.7" transform="rotate(144) translate(0 -3.3)"/>
    <ellipse rx="2.1" ry="3.2" fill="#f7fbfd" stroke="#7fc3e8" stroke-width="0.7" transform="rotate(216) translate(0 -3.3)"/>
    <ellipse rx="2.1" ry="3.2" fill="#f7fbfd" stroke="#7fc3e8" stroke-width="0.7" transform="rotate(288) translate(0 -3.3)"/>
    <circle r="1.55" fill="#b26a3b"/>
    <circle r="0.65" fill="#e8a25c"/>
  </g>
  <!-- blossom centre -->
  <g transform="translate(124 7.1)">
    <ellipse rx="2" ry="3" fill="#f7fbfd" stroke="#7fc3e8" stroke-width="0.7" transform="rotate(36) translate(0 -3.1)"/>
    <ellipse rx="2" ry="3" fill="#f7fbfd" stroke="#7fc3e8" stroke-width="0.7" transform="rotate(108) translate(0 -3.1)"/>
    <ellipse rx="2" ry="3" fill="#f7fbfd" stroke="#7fc3e8" stroke-width="0.7" transform="rotate(180) translate(0 -3.1)"/>
    <ellipse rx="2" ry="3" fill="#f7fbfd" stroke="#7fc3e8" stroke-width="0.7" transform="rotate(252) translate(0 -3.1)"/>
    <ellipse rx="2" ry="3" fill="#f7fbfd" stroke="#7fc3e8" stroke-width="0.7" transform="rotate(324) translate(0 -3.1)"/>
    <circle r="1.45" fill="#b26a3b"/>
    <circle r="0.6" fill="#e8a25c"/>
  </g>
  <!-- blossom right -->
  <g transform="translate(184 8.8)">
    <ellipse rx="1.9" ry="2.9" fill="#f7fbfd" stroke="#7fc3e8" stroke-width="0.7" transform="rotate(18) translate(0 -3)"/>
    <ellipse rx="1.9" ry="2.9" fill="#f7fbfd" stroke="#7fc3e8" stroke-width="0.7" transform="rotate(90) translate(0 -3)"/>
    <ellipse rx="1.9" ry="2.9" fill="#f7fbfd" stroke="#7fc3e8" stroke-width="0.7" transform="rotate(162) translate(0 -3)"/>
    <ellipse rx="1.9" ry="2.9" fill="#f7fbfd" stroke="#7fc3e8" stroke-width="0.7" transform="rotate(234) translate(0 -3)"/>
    <ellipse rx="1.9" ry="2.9" fill="#f7fbfd" stroke="#7fc3e8" stroke-width="0.7" transform="rotate(306) translate(0 -3)"/>
    <circle r="1.4" fill="#b26a3b"/>
    <circle r="0.55" fill="#e8a25c"/>
  </g>
</svg>
