<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 28" fill="none" aria-hidden="true">
  <!--
    Blue-throated Bee-eater skin - selected-row corner scene (26x28).
    Flower-and-bird (huaniaohua) ink-wash rendering: soft 没骨 washes of
    grass and leaf in 青绿, a white five-petal blossom washed in pale azure
    with a warm chestnut heart, and a small bee diving head-first toward the
    flower - ink head and antennae forward, amber-washed abdomen swept back,
    translucent wings trailing. Original artwork by dsh-web, Apache-2.0.
  -->
  <defs>
    <linearGradient id="grassWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fbfa5"/>
      <stop offset="1" stop-color="#4f8468"/>
    </linearGradient>
    <linearGradient id="grassInk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7b938c" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#55706b" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="leafWash" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#86b79a"/>
      <stop offset="1" stop-color="#6a9f82"/>
    </linearGradient>
    <radialGradient id="petalWash" cx="0.5" cy="0.3" r="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.75" stop-color="#f2f8fa"/>
      <stop offset="1" stop-color="#dfeef4"/>
    </radialGradient>
    <radialGradient id="heartWash" cx="0.5" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#d9af6e"/>
      <stop offset="1" stop-color="#b2764a"/>
    </radialGradient>
    <linearGradient id="beeWash" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#eab873"/>
      <stop offset="1" stop-color="#bd8244"/>
    </linearGradient>
    <radialGradient id="haloWash" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#bfe0ee" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#bfe0ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#bfe0ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wingWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f3f8" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#c9e2ec" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <!-- meadow tuft: soft blade washes rising from the lower edge -->
  <path d="M1.2 28 C 1 25, 1.6 22.4, 3.6 20.8 C 2.6 23.8, 2.4 26, 2.8 28 Z" fill="url(#grassWash)" opacity="0.9"/>
  <path d="M4.6 28 C 4.6 24.6, 5.6 22, 8 20.6 C 6.8 23.8, 6.6 26.2, 6.8 28 Z" fill="url(#grassInk)" opacity="0.75"/>
  <path d="M8.4 28 C 8.6 25.6, 9.8 23.4, 12.2 22 C 10.8 24.8, 10.6 26.6, 10.8 28 Z" fill="url(#grassWash)" opacity="0.85"/>
  <path d="M13.6 28 C 14 26.2, 15.2 24.4, 17.6 23.2 C 16.2 25.6, 16.4 27, 16.8 28 Z" fill="url(#grassWash)" opacity="0.7"/>
  <path d="M18.8 28 C 19.2 25.6, 20.4 23.4, 22.8 22 C 21.4 24.8, 21.2 26.6, 21.4 28 Z" fill="url(#grassInk)" opacity="0.6"/>
  <path d="M22.6 28 C 23 26, 24.2 24.2, 25.8 23 C 24.6 25.4, 24.4 26.8, 24.4 28 Z" fill="url(#grassWash)" opacity="0.8"/>

  <!-- stem: double ink-green stroke for a brushy feel -->
  <path d="M7.8 26.2 C 7.5 22.4, 7.4 18.7, 7.7 15.2" stroke="#5f7d6d" stroke-width="1" stroke-linecap="round" opacity="0.9"/>
  <path d="M8.1 25.9 C 7.9 22.6, 7.8 19.2, 8.05 15.7" stroke="#5f7d6d" stroke-width="0.5" stroke-linecap="round" opacity="0.45"/>

  <!-- leaf: boneless wash with a single vein -->
  <path d="M7.9 21.6 C 10.3 20.8, 12.3 19.3, 13.6 17.4 C 12.5 19.9, 10.4 21.5, 8.3 22.1 Z" fill="url(#leafWash)"/>
  <path d="M8.2 21.7 C 10 20.9, 11.6 19.6, 12.9 17.8" stroke="#5f8a72" stroke-width="0.45" stroke-linecap="round" opacity="0.75"/>

  <!-- blossom: five washed petals, pale azure rim, warm heart and ink dot -->
  <g transform="translate(7.9 10.1)">
    <g fill="url(#petalWash)" stroke="#a9cbda" stroke-width="0.5" stroke-opacity="0.8">
      <ellipse rx="2.2" ry="3.1" transform="rotate(0) translate(0 -3.1)"/>
      <ellipse rx="2.2" ry="3.1" transform="rotate(72) translate(0 -3.1)"/>
      <ellipse rx="2.2" ry="3.1" transform="rotate(144) translate(0 -3.1)"/>
      <ellipse rx="2.2" ry="3.1" transform="rotate(216) translate(0 -3.1)"/>
      <ellipse rx="2.2" ry="3.1" transform="rotate(288) translate(0 -3.1)"/>
    </g>
    <circle r="1.7" fill="url(#heartWash)"/>
    <circle r="0.5" fill="#6b4a2c" opacity="0.9"/>
  </g>

  <!-- bee: head-first toward the flower, abdomen swept back, wings trailing -->
  <g transform="translate(19 5.6) rotate(126)">
    <!-- wings, trailing above the abdomen -->
    <path d="M1.2 -0.6 Q2.6 -3.4 0.9 -4.7 Q-0.6 -5.3 -1.9 -4.1 Q-2.7 -2.7 -1.2 -1.5 Q-0.2 -0.8 1.2 -0.6 Z" fill="url(#wingWash)"/>
    <path d="M1 -0.4 Q1.8 -2.6 0.4 -3.7 Q-0.7 -4.2 -1.7 -3.3 Q-2.3 -2.2 -1 -1.3 Q-0.2 -0.7 1 -0.4 Z" fill="url(#wingWash)" opacity="0.7"/>
    <path d="M1 -0.8 Q1.9 -2.6 0.8 -3.9 M0.9 -0.6 Q0.2 -2.4 -1 -3.5" stroke="#a8ccdc" stroke-width="0.35" opacity="0.6"/>
    <!-- abdomen: amber wash, ink stripes, wasp-waist to the head -->
    <path d="M0.4 -0.1 Q0.9 0.5 -0.1 1 Q-2.4 2 -4.6 1.3 Q-5.3 0.8 -5.1 0.1 Q-5.3 -0.7 -4.6 -1.2 Q-2.4 -1.9 -0.1 -0.9 Q0.9 -0.4 0.4 0.1 Z" fill="url(#beeWash)"/>
    <path d="M-0.6 -1 Q-1.2 0 -0.6 1 M-1.9 -1.2 Q-2.5 0 -1.9 1.3 M-3.2 -0.9 Q-3.8 0 -3.2 1" stroke="#5a4632" stroke-width="0.55" opacity="0.75" fill="none"/>
    <!-- thorax + head, facing the flower -->
    <ellipse cx="1.1" cy="0" rx="1.5" ry="1.05" fill="#c9964f"/>
    <circle cx="2.75" cy="0" r="1.35" fill="#4d5a63"/>
    <path d="M3.4 -0.9 L4.9 -1.7 M3.5 0.6 L5.1 0.4" stroke="#4d5a63" stroke-width="0.45" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- soft azure halo wash behind the bee, so it reads on the dark theme -->
  <circle cx="19" cy="5.6" r="5.2" fill="url(#haloWash)" opacity="0.5"/>

  <!-- approach flecks behind the bee, coming from the upper right -->
  <path d="M23.6 2.4 L24.9 1.3 M24.4 3.6 L25.5 2.9" stroke="#7f9aa6" stroke-width="0.5" stroke-linecap="round" opacity="0.7"/>
</svg>
